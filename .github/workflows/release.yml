name: Release

# Tagging publishes (tags look like v0.1.0); the version comes from __version__ in
# src/uniparser2/__init__.py.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build
        run: uv build
      - name: Check tag matches package version
        run: |
          python - <<'PY'
          import pathlib, re, sys
          tag = "${{ github.ref_name }}".lstrip("v")
          text = pathlib.Path("src/uniparser2/__init__.py").read_text(encoding="utf-8")
          version = re.search(r'^__version__ = "([^"]+)"', text, re.M).group(1)
          if tag and tag != "workflow_dispatch" and tag != version:
              sys.exit(f"tag {tag!r} does not match package version {version!r}")
          print("version:", version)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # PyPI needs a Trusted Publisher configured for this repository first (workflow: release.yml,
    # environment: pypi); after that no token is needed. Until it is configured this job fails, which
    # is expected.
    environment:
      name: pypi
      url: https://pypi.org/p/uniparser2
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        run: uv publish
