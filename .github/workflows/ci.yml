name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Minimum permissions: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.15 is an alpha (3.15.0a7 via uv at the time of writing); the optional engines already
        # publish cp315/abi3 wheels, so the cell is usable. Drop the pre-release note once stable.
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      # setup-uv stopped publishing floating major tags after v7, so this one is an exact tag.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # Install the supported optional dependencies: the behavioral assertions for
      # css/xpath/json/HTML-to-Markdown have to run once with every dependency present.
      # `code` (the in-chain code sandbox) is installed only in the 3.13 cell: it is a ~12 MB platform
      # binary and there is no point pulling a copy into every matrix cell; in the other cells
      # tests/ops/test_code.py is skipped as a whole module (isolation and limit cases cannot really
      # run without the sandbox, and skipping is more honest than faking coverage with a stand-in),
      # while tests/ops/test_code_gate.py still runs -- it verifies exactly the fact that without the
      # dependency the operator must be unusable at compile time. The dev group does **not** pin
      # pydantic-monty, otherwise every cell would install it.
      - name: Sync
        run: |
          EXTRAS="--extra html --extra xml --extra json --extra md"
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            EXTRAS="$EXTRAS --extra code"
          fi
          uv sync $EXTRAS

      # The suite is the gate: it holds the conformance audit, the committed sample chains and the
      # catalogue freshness, so CI runs tests only (no separate lint/type/security steps).
      - name: Test with core coverage gate
        run: uv run pytest --cov=uniparser2.core --cov-fail-under=95 --cov-report=term-missing
